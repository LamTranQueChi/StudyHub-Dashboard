<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/hieuung.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-card-tools"><button class="language-toggle" type="button" data-language-toggle aria-label="Chuyển ngôn ngữ" title="Chuyển ngôn ngữ">EN</button></div>
      <div class="login-brand">
        <div class="login-brand-icon"><span class="material-symbols-outlined">school</span></div>
        <div><h1>StudyHub</h1><p>STUDENT PORTAL</p></div>
      </div>
      <h2>Đăng nhập</h2>
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">Email sinh viên</label>
          <input id="loginEmail" name="email" type="email" placeholder="MSSV@st.tvu.edu.vn" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" name="password" type="password" placeholder="Ngày sinh ddmmyyyy (ví dụ 15092006)" autocomplete="current-password" required>
        </div>
        <button class="login-submit" type="submit">Đăng nhập <span class="material-symbols-outlined">login</span></button>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>

    </section>
  </main>
  <script src="../js/ngonngu.js"></script>
    <script src="../js/hieuung.js"></script>
    <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
