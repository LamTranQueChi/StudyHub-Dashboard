<header class="topbar">
    <div class="topbar-leading">
        <button class="sidebar-toggle" id="sidebarToggle" type="button"
                aria-label="Mở menu" aria-expanded="false" title="Mở menu">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="search-box">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            <input type="text" id="searchInput" placeholder="Tìm kiếm khóa học, tài liệu, lớp..."
                   aria-label="Tìm kiếm khóa học, tài liệu, lớp">
        </div>
    </div>
    <div class="topbar-right">
        <button class="notification-btn" type="button" aria-label="Thông báo" title="Thông báo">
            <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
            <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <div class="user-profile">
            <div class="user-info">
                <strong id="topbarUserName">Xin chào, Lâm Trần Quế Chi!</strong>
                <span id="topbarUserClass">DA24TTA</span>
            </div>
            <button class="user-avatar" id="topbarAvatarButton" type="button"
                    aria-label="Mở cài đặt tài khoản" title="Cài đặt tài khoản">
                <img id="topbarAvatar" src="../assets/images/avatar_macdinh.jpg" alt="Ảnh đại diện tài khoản">
            </button>
        </div>
    </div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
